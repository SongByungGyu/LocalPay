[project]
name = "localpay-backend"
version = "0.1.0"
description = "LocalPay Backend API — 온누리·지역화폐 가맹점 지도 서비스"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
